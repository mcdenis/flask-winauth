[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-winauth"
description = "Flask extension for Windows Authentication."
version = "1.0.0"
dependencies = [
    "pywin32"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
typeCheckingMode = "off"